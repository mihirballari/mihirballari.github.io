name: Build and Deploy (markdown-memo)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make pandoc python3 python3-pip

      - name: Build HTML
        run: |
          make install
          make html

      - name: Stage artifact
        run: |
          rm -rf public
          mkdir -p public
          shopt -s nullglob
          cp -v *.html public/ || true
          cp -v *.css public/ || true
          cp -v *.js public/ || true
          cp -rv templates public/templates || true
          cp -rv img public/img || true
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
